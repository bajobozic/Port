#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.builtInKotlin=false
android.newDsl=false
# Fix for SwiftPM dependencies with embedAndSign integration
kotlin.apple.native.enableSwiftPackage=false
kotlin.apple.native.ignoreSwiftFrameworkCheck=true
kotlin.apple.native.allowSwiftPMDependenciesWithEmbedAndSign=true
